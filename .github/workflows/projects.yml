name: Generate Projects Panel

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - ".github/scripts/fetch_data.py"
      - ".github/scripts/generate_projects.py"
      - ".github/workflows/projects.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_data.py

      - name: Generate project SVGs
        run: |
          rm -rf out
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out
          touch out/.nojekyll

      - name: Publish projects branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan projects-publish
          git rm -rf .
          cp -R out/. .
          git add -A
          git commit -m "Update projects panel [skip ci]"
          git push origin HEAD:projects --force
