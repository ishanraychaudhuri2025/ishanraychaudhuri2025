name: Render exact trophy cabinet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the exact uploaded trophy panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('profile-dark-exact-trophies.svg')
          svg = path.read_text(encoding='utf-8')

          replacement = '<image href="./assets/trophy-panel-exact-logos.webp" x="940" y="124" width="202" height="442" preserveAspectRatio="xMidYMid meet"/>'
          svg, count = re.subn(r'<image\b[^>]*\bx="940"\b[^>]*/>', replacement, svg, count=1)
          if count != 1:
              raise SystemExit('Expected exactly one trophy image placeholder in profile-dark-exact-trophies.svg')

          path.write_text(svg, encoding='utf-8')
          PY

      - name: Commit rendered profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-dark-exact-trophies.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(profile): render exact trophy panel [skip ci]'
          git push
