name: Embed exact trophy cabinet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline exact trophy image into profile SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          svg_path = Path('profile-dark-exact-trophies.svg')
          img_path = Path('assets/trophy-exact-panel.png')
          svg = svg_path.read_text(encoding='utf-8')
          data = base64.b64encode(img_path.read_bytes()).decode('ascii')
          replacement = f'href="data:image/png;base64,{data}"'
          svg = re.sub(r'href="(?:\.\/)?assets/trophy-exact-panel\.png(?:\?[^\"]*)?"', replacement, svg)
          svg = re.sub(r'href="data:image/png;base64,[^\"]+"', replacement, svg)
          svg_path.write_text(svg, encoding='utf-8')
          PY
      - name: Commit generated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-dark-exact-trophies.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(profile): inline exact trophy cabinet [skip ci]'
          git push
