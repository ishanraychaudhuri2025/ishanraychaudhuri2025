name: Render exact trophy cabinet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/embed-exact-trophy.yml'
      - 'assets/trophy-panel-exact-logos.webp.txt'
      - 'profile-dark-exact-trophies.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inline exact uploaded trophy artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          svg_path = Path('profile-dark-exact-trophies.svg')
          b64_path = Path('assets/trophy-panel-exact-logos.webp.txt')
          svg = svg_path.read_text(encoding='utf-8')
          b64 = ''.join(b64_path.read_text(encoding='utf-8').split())

          if len(b64) < 9000:
              raise SystemExit(f'Exact trophy base64 is unexpectedly short: {len(b64)} characters')

          replacement = f'<image href="data:image/webp;base64,{b64}" x="938" y="130" width="160" height="394" preserveAspectRatio="xMidYMid meet"/>'

          # The current profile has exactly one raster image: the trophy panel.
          # Replace that element regardless of its previous href/coordinates.
          svg2, count = re.subn(r'(?s)<image\b[^>]*/>', replacement, svg, count=1)
          if count != 1:
              raise SystemExit(f'Expected one trophy image element, found {count}')

          # Verify the replacement is actually embedded and complete.
          if 'data:image/webp;base64,' not in svg2:
              raise SystemExit('Trophy data URI was not inserted')
          if len(svg2) < len(svg) + 8000:
              raise SystemExit('Embedded SVG is unexpectedly short')

          svg_path.write_text(svg2, encoding='utf-8')
          print(f'Embedded exact trophy artwork: {len(b64)} base64 characters')
          PY

      - name: Commit updated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-dark-exact-trophies.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(profile): embed exact trophy artwork [skip ci]'
          git push
