name: Generate Profile Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy trophy cabinet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("dark.svg", "light.svg"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'\s*<g\s+id=["\']trophy-cabinet["\'][^>]*>.*?</g>\s*', '\n', text, flags=re.DOTALL | re.IGNORECASE)
              text = re.sub(r'\s*<image\s+id=["\']trophy-cabinet["\'][^>]*/>\s*', '\n', text, flags=re.DOTALL | re.IGNORECASE)
              path.write_text(text, encoding="utf-8")
          print("Removed all trophy cabinet markup")
          PY

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: assets
        run: python3 .github/scripts/generate_stats.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg assets/stats-dark.svg assets/stats-light.svg assets/langs-dark.svg assets/langs-light.svg
          if git diff --cached --quiet; then
            echo "No generated profile changes."
            exit 0
          fi
          git commit -m "chore(profile): remove trophy cabinet and refresh generated assets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
