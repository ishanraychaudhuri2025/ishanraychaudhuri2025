name: Generate Profile Stats + Trophy Cabinet

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed trophy cabinet
        run: python3 .github/scripts/embed_trophy.py

      - name: Validate profile artwork
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ('dark.svg', 'light.svg', 'assets/trophy-cabinet.svg'):
              ET.parse(name)
              print(f'OK: {name}')

          stale_markers = (
              'trophy-cabinet-exact.svg',
              'trophy-panel-final',
              'trophy-panel-hifi',
              'trophy-panel-reference',
              'trophy-exact-',
              'trophy-q95-',
              'trophy_exact_chunks',
          )

          for name in ('dark.svg', 'light.svg'):
              text = Path(name).read_text(encoding='utf-8')
              count = text.count('id="trophy-cabinet"')
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one trophy cabinet, found {count}')
              for marker in stale_markers:
                  if marker in text:
                      raise SystemExit(f'{name}: stale trophy reference remains: {marker}')

          print('Trophy validation passed: exactly one final cabinet, legacy references absent.')
          PY

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: assets
        run: python3 .github/scripts/generate_stats.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg assets/trophy-cabinet.svg assets/stats-dark.svg assets/stats-light.svg assets/langs-dark.svg assets/langs-light.svg
          if git diff --cached --quiet; then
            echo "No generated profile changes."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated profile assets [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
