name: Build Exact Trophy Asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode exact uploaded trophy panel
        run: |
          base64 -d assets/trophy-panel-exact-logos.webp.txt > assets/trophy-panel-exact-logos.webp
          file assets/trophy-panel-exact-logos.webp

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy-panel-exact-logos.webp
          git diff --cached --quiet || git commit -m "chore(profile): build exact trophy panel [skip ci]"
          git push
