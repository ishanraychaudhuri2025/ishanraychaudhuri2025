name: Reconstruct exact trophy panel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact uploaded trophy panel
        run: |
          test -f assets/trophy-exact-00.b64
          base64 -d assets/trophy-exact-00.b64 > assets/trophy-exact-panel.png
          file assets/trophy-exact-panel.png
      - name: Commit decoded panel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/trophy-exact-panel.png
          git diff --cached --quiet && exit 0
          git commit -m 'chore(profile): add decoded exact trophy panel [skip ci]'
          git push
