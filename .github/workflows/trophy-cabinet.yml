name: Embed Trophy Cabinet

on:
  push:
    branches: [main]
    paths:
      - 'assets/trophy-cabinet.svg'
      - '.github/scripts/embed_trophy.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed trophy vector
        run: python3 .github/scripts/embed_trophy.py

      - name: Commit generated profile banners
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dark.svg light.svg
          if git diff --cached --quiet; then
            echo 'No generated trophy changes.'
            exit 0
          fi
          git commit -m 'build(profile): embed trophy cabinet [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
