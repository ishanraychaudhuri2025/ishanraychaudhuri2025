name: Embed Trophy Cabinet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trophy-cabinet
  cancel-in-progress: true

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Embed trophy vector
        run: python3 .github/scripts/embed_trophy.py

      - name: Validate generated SVGs
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('dark.svg', 'light.svg', 'assets/trophy-cabinet.svg'):
              ET.parse(name)
              print(f'OK: {name}')
          for name in ('dark.svg', 'light.svg'):
              text = open(name, encoding='utf-8').read()
              if text.count('id="trophy-cabinet"') != 1:
                  raise SystemExit(f'{name}: expected exactly one trophy cabinet, found {text.count("id=\\\"trophy-cabinet\\\"")}')
              if 'data:image/webp;base64' in text or 'trophy-cabinet-exact.svg' in text:
                  raise SystemExit(f'{name}: stale trophy reference remains')
          PY

      - name: Commit generated profile banners
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dark.svg light.svg
          if git diff --cached --quiet; then
            echo 'No generated trophy changes.'
            exit 0
          fi
          git commit -m 'build(profile): embed trophy cabinet [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
