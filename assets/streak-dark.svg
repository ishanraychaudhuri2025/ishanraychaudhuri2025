  <line x1="393.33" y1="28" x2="393.33" y2="167" stroke="#C8102E" stroke-width="1"/>
  <line x1="786.67" y1="28" x2="786.67" y2="167" stroke="#C8102E" stroke-width="1"/>

  <!-- LEFT / ACTIVE DAYS -->
